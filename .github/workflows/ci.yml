name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
      - name: D3 defect tests (scenario_rm_03 scenario_rm_05 scenario_rm_06 scenario_rm_11)
        run: |
          cargo test scenario_rm_03
          cargo test scenario_rm_05
          cargo test scenario_rm_06
          cargo test scenario_rm_11
